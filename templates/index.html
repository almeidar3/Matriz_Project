<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f4f1">
    <title>Matriz | Projetos e tarefas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </head>
  <body>
    <section id="login-view" class="login-view" aria-labelledby="login-title" hidden>
      <div class="login-mark">M</div>
      <p class="eyebrow">ESPAÇO DE TRABALHO</p>
      <h1 id="login-title">Matriz</h1>
      <p class="login-copy">Organiza projetos. Mantém o trabalho em movimento.</p>
      <form id="login-form" class="form-stack">
        <label for="username">Utilizador</label>
        <input id="username" name="username" autocomplete="username" required>
        <label for="password">Palavra-passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button class="button button-primary button-wide" type="submit">Iniciar sessão</button>
      </form>
    </section>

    <div id="app-shell" class="app-shell" hidden>
      <aside class="sidebar" aria-label="Navegação principal">
        <a class="brand" href="#home" aria-label="Matriz, início"><span class="brand-mark">M</span><span>Matriz</span></a>
        <div class="workspace-block">
          <label class="eyebrow" for="workspace-select">ESPAÇO DE TRABALHO</label>
          <select id="workspace-select" aria-label="Selecionar espaço de trabalho"></select>
        </div>
        <div class="sidebar-heading"><span>PROJETOS</span><button id="new-project-open" class="icon-button" type="button" title="Criar projeto" aria-label="Criar projeto">+</button></div>
        <nav id="project-nav" class="project-nav" aria-label="Projetos"></nav>
        <button id="home-open" class="nav-link home-link" type="button"><span class="nav-symbol">⌂</span> Painel inicial</button>
        <div class="sidebar-bottom">
          <div class="user-chip"><span id="user-avatar" class="avatar">M</span><span><strong id="user-name"></strong><small id="user-role"></small></span></div>
          <button id="logout-button" class="text-button" type="button">Terminar sessão</button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar"><div class="breadcrumb" id="breadcrumb">Painel inicial</div><div class="topbar-date" id="topbar-date"></div></header>
        <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
        <section id="main-content" class="content" aria-live="polite"></section>
      </main>
    </div>
    <div id="dialog-root"></div>
  </body>
</html>
