name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Run end-to-end tests
        run: python -m unittest discover -s tests/e2e -v

      - name: Check frontend JavaScript
        run: node --check static/app.js

      - name: Generate an ephemeral application secret
        run: echo "MATRIX_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build application image
        run: docker compose build