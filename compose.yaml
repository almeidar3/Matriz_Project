services:
  web:
    build:
      context: .
    environment:
      MATRIX_SECRET_KEY: ${MATRIX_SECRET_KEY:?Define MATRIX_SECRET_KEY in .env}
      MATRIX_COOKIE_SECURE: ${MATRIX_COOKIE_SECURE:-0}
      MATRIX_SEED_DEMO: ${MATRIX_SEED_DEMO:-0}
      PORT: "5000"
    ports:
      - "127.0.0.1:${MATRIX_PORT:-5000}:5000"
    volumes:
      - matriz_data:/app/instance
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/api/health', timeout=2)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  matriz_data: